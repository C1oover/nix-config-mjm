.snippets:
  setup_devenv:
    - . "$HOME/.nix-profile/etc/profile.d/nix.sh"
  nixos_changes:
    - .gitlab-ci.yml
    - default.nix
    - plans.nix
    - apps/**/*
    - home/**/*
    - hosts/**/*
    - modules/**/*
    - npins/*
    - packages/**/*
    - secrets/**/*
    - services/**/*
  tofu_changes:
    - .gitlab-ci.yml
    - npins/*
    - services/**/*
    - terraform/**/*
stages:
  - check
  - deploy
variables:
  CONSUL_HTTP_ADDR: "consul.service.consul:8500"
  VAULT_ADDR: "http://vault.service.consul:8200"
build nixos hosts:
  tags: [nix-shell]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.snippets, nixos_changes]
  stage: check
  needs: []
  id_tokens:
    VAULT_ID_TOKEN:
      aud: http://vault.service.consul:8200
  script:
    - nix run -f . host-scripts -- ci attic-login
    - nix run -f . host-scripts -- ci diff
deploy nixos hosts:
  tags: [nix-shell]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes: !reference [.snippets, nixos_changes]
  stage: deploy
  needs: []
  environment:
    name: production
  resource_group: production/nixos
  id_tokens:
    VAULT_ID_TOKEN:
      aud: http://vault.service.consul:8200
  # before_script: !reference [.snippets, setup_devenv]
  script:
    - nix run -f . host-scripts -- ci attic-login
    - nix run -f . host-scripts -- ci deploy
build tofu changes:
  tags: [nix]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.snippets, tofu_changes]
  stage: check
  needs: []
  variables:
    TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "yes"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: http://vault.service.consul:8200
  before_script: !reference [.snippets, setup_devenv]
  script:
    - nix run -f . tofu-scripts -- ci plan
apply terranix changes:
  tags: [nix]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes: !reference [.snippets, tofu_changes]
  stage: deploy
  needs: []
  environment:
    name: production
  resource_group: production/nomad
  variables:
    TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "yes"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: http://vault.service.consul:8200
  before_script: !reference [.snippets, setup_devenv]
  script:
    - nix run -f . tofu-scripts -- ci apply
check for flake updates:
  tags: [nix-shell]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  stage: check
  # before_script: !reference [.snippets, setup_devenv]
  script:
    - nix run -f . scripts -- ci update-pins

.vault:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: http://vault.service.consul:8200
stages:
  - check
  - deploy
variables:
  CONSUL_HTTP_ADDR: "consul.service.consul:8500"
  VAULT_ADDR: "http://vault.service.consul:8200"
  PULUMI_HOME: "/tmp/pulumi-home-$CI_PROJECT_ID"
build nixos hosts:
  extends:
    - .vault
  tags: [nix-shell]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  stage: check
  needs: []
  resource_group: production/nixos
  script:
    - nix run -f . dippy -- -concurrency=6 diff
deploy nixos hosts:
  extends:
    - .vault
  tags: [nix-shell]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  stage: deploy
  needs: []
  environment:
    name: production/nixos
    deployment_tier: production
  resource_group: production/nixos
  script:
    - nix run -f . dippy -- -concurrency=6 deploy
check for updates:
  tags: [nix-shell]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  stage: check
  script:
    - nix run -f . scripts.update -- ci update-pins

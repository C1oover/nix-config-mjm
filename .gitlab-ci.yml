stages:
  - check
  - deploy
variables:
  VAULT_ADDR: "https://vault.service.consul:8200"
  SPIFFE_ENDPOINT_SOCKET: unix:///run/spire-agent/api.sock
build nixos hosts:
  tags: [nix]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  stage: check
  needs: []
  resource_group: production/nixos
  script:
    - nix run -f . dippy -- -concurrency=4 diff
deploy nixos hosts:
  tags: [nix]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  stage: deploy
  needs: []
  environment:
    name: production/nixos
    deployment_tier: production
  resource_group: production/nixos
  script:
    - nix run -f . dippy -- -concurrency=4 deploy
check for updates:
  tags: [nix]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  stage: check
  script:
    - nix run -f . scripts.update -- ci update-pins

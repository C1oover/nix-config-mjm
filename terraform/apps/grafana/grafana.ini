[log]
level = info

[database]
type = postgres
host = postgresql.service.consul
name = grafana
{{ with secret "database/creds/grafana" -}}
user = {{ .Data.username }}
password = """{{ .Data.password }}"""
{{ end -}}
ssl_mode = disable

[users]
auto_assign_org_role = Admin

[auth.proxy]
enabled = true
header_name = Remote-User
auto_sign_up = true
headers = Email:Remote-Email
enable_login_token = false

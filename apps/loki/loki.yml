auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_transfer_retries: 0
  wal:
    enabled: false

schema_config:
  configs:
    - from: 2020-07-01
      store: boltdb-shipper
      object_store: aws
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  enforce_metric_name: false

chunk_store_config:
  max_look_back_period: 0s

table_manager:
  retention_deletes_enabled: true
  retention_period: 672h

ruler:
  storage:
    type: local
    local:
      directory: /tmp/rules/fake
  rule_path: '{{ env "NOMAD_TASK_DIR" }}/data/loki/rules'
  alertmanager_url: http://alertmanager.service.consul:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

query_scheduler:
  max_outstanding_requests_per_tenant: 2048

storage_config:
  aws:
    {{ with secret "kv/loki" }}
    s3: "http://{{ .Data.data.garage_key_id }}:{{ .Data.data.garage_secret_key }}@garage.service.consul:3902"
    {{ end }}
    region: home
    bucketnames: loki-logs
    insecure: true
    s3forcepathstyle: true
  boltdb_shipper:
    active_index_directory: {{ env "NOMAD_TASK_DIR" }}/data/loki/boltdb-shipper-active
    cache_location: {{ env "NOMAD_TASK_DIR" }}/data/loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: s3

compactor:
  working_directory: {{ env "NOMAD_TASK_DIR" }}/data/loki/compactor
  shared_store: s3


modules:

  dns_public:
    prober: dns
    timeout: 5s
    dns:
      query_name: "www.google.com"
      query_type: "A"
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - "www\\.google\\.com\\.\t.*\tIN\tA\t.*"

  dns_private:
    prober: dns
    timeout: 5s
    dns:
      query_name: "megaera.home.mattmoriarity.com"
      query_type: "A"
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - "megaera\\.home\\.mattmoriarity\\.com\\.\t.*\tIN\tA\t10\\.0\\.2\\.40"

  dns_private_cname:
    prober: dns
    timeout: 5s
    dns:
      query_name: "homelab.home.mattmoriarity.com"
      query_type: "CNAME"
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - "homelab\\.home\\.mattmoriarity\\.com\\.\t.*\tIN\tCNAME\tingress-http\\.service\\.consul\\."

  dns_ad_blocking:
    prober: dns
    timeout: 5s
    dns:
      query_name: "googleadservices.com"
      query_type: "A"
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - "googleadservices\\.com\\.\t.*\tIN\tA\t0\\.0\\.0\\.0"

  https_homelab:
    prober: http
    http:
      method: GET
      preferred_ip_protocol: ip4
      tls_config:
        ca_file: "{{ env "NOMAD_TASK_DIR" }}/ca.pem"

